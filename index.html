<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Trip - Premium Bus Tours | Sri Kandha Transport</title>
    <meta name="description" content="Adventure Trip - South India's premier luxury bus tour operator covering Tamil Nadu, Kerala, Karnataka, and Andhra Pradesh.">
    
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@400;500;600;700&family=Racing+Sans+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand-red: #dc0a0a;
            --brand-black: #0d0d0d;
            --brand-yellow: #ffd700;
            --accent-orange: #ff4500;
            --dark: #1a1a1a;
            --light: #f8f9fa;
            --text: #2d3436;
            --text-light: #636e72;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: var(--text);
            overflow-x: hidden;
            background: white;
            line-height: 1.6;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Icon Styles */
        .icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            vertical-align: middle;
        }

        .icon-small {
            width: 18px;
            height: 18px;
        }

        .icon-large {
            width: 40px;
            height: 40px;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(13, 13, 13, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(220, 10, 10, 0.3);
            border-bottom: 3px solid var(--brand-red);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Racing Sans One', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: var(--brand-red);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-shadow: 0 0 20px rgba(220, 10, 10, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(220, 10, 10, 0.5); }
            to { text-shadow: 0 0 20px rgba(220, 10, 10, 0.8), 0 0 30px rgba(220, 10, 10, 0.4); }
        }

        .logo-icon {
            font-size: 2.2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s;
            letter-spacing: 1px;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--brand-red);
            transition: width 0.3s;
        }

        .nav-links a:hover {
            color: var(--brand-red);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
        }

        /* Hero */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0d0d 0%, #2d2d2d 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 80px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=1600&h=900&fit=crop') center/cover;
            opacity: 0.15;
            animation: slowZoom 30s ease-in-out infinite alternate;
        }

        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 2rem;
            max-width: 1200px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-badge {
            display: inline-block;
            background: var(--brand-red);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            box-shadow: 0 0 30px rgba(220, 10, 10, 0.6);
        }

        .hero h1 {
            font-family: 'Teko', sans-serif;
            font-size: 6rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(to right, #fff, var(--brand-red), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            opacity: 0.9;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1.2rem 3rem;
            border: none;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        .btn-primary {
            background: var(--brand-red);
            color: white;
            box-shadow: 0 10px 40px rgba(220, 10, 10, 0.5);
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        .btn-primary:hover {
            background: #ff0000;
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(220, 10, 10, 0.6);
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 3px solid var(--brand-red);
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        .btn-outline:hover {
            background: var(--brand-red);
            transform: translateY(-3px);
        }

        /* Fleet Showcase */
        .fleet-showcase {
            background: var(--brand-black);
            padding: 5rem 2rem;
            position: relative;
        }

        .fleet-showcase::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(135deg, #dc0a0a 0%, #8b0000 100%);
        }

        .fleet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .fleet-card {
            position: relative;
            overflow: hidden;
            border: 3px solid var(--brand-red);
            background: #1a1a1a;
            transition: all 0.4s ease;
        }

        .fleet-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(220, 10, 10, 0.4);
        }

        .fleet-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .fleet-card:hover .fleet-image {
            transform: scale(1.1);
        }

        .fleet-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(13, 13, 13, 0.95), transparent);
            padding: 2rem;
            color: white;
        }

        .fleet-title {
            font-family: 'Teko', sans-serif;
            font-size: 2rem;
            color: var(--brand-red);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        /* Media Gallery */
        .media-gallery {
            padding: 5rem 2rem;
            background: #f5f5f5;
        }

        .gallery-tabs {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .gallery-tab {
            padding: 1rem 2.5rem;
            background: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            font-family: 'Rajdhani', sans-serif;
        }

        .gallery-tab.active {
            background: var(--brand-red);
            color: white;
            box-shadow: 0 5px 20px rgba(220, 10, 10, 0.4);
        }

        .gallery-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .video-card {
            position: relative;
            background: var(--brand-black);
            border: 3px solid var(--brand-red);
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(13, 13, 13, 0.95), transparent);
            color: white;
            padding: 1.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Section Styles */
        .section {
            padding: 5rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-tag {
            color: var(--brand-red);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .section-title {
            font-family: 'Teko', sans-serif;
            font-size: 4rem;
            color: var(--brand-black);
            margin-bottom: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .section-description {
            color: var(--text-light);
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            font-weight: 500;
        }

        /* Destinations - New Design */
        .state-filter {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .state-tab {
            padding: 1rem 2rem;
            background: white;
            border: 3px solid transparent;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }

        .state-tab:hover {
            border-color: var(--brand-red);
            transform: translateY(-2px);
        }

        .state-tab.active {
            background: var(--brand-red);
            color: white;
            border-color: var(--brand-red);
            box-shadow: 0 5px 20px rgba(220, 10, 10, 0.4);
        }

        .state-section {
            display: none;
        }

        .state-section.active {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }

        .state-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 3px solid var(--brand-red);
        }

        .state-icon {
            font-size: 3rem;
        }

        .state-name {
            font-family: 'Teko', sans-serif;
            font-size: 3rem;
            color: var(--brand-black);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .category-section {
            margin-bottom: 3rem;
        }

        .category-title {
            font-family: 'Teko', sans-serif;
            font-size: 2rem;
            color: var(--brand-red);
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .destinations-mini-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .destination-mini-card {
            background: white;
            padding: 1.5rem;
            border: 3px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .destination-mini-card:hover {
            border-color: var(--brand-red);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(220, 10, 10, 0.2);
        }

        .destination-mini-icon {
            font-size: 2rem;
            margin-bottom: 0.8rem;
        }

        .destination-mini-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--brand-black);
            letter-spacing: 0.5px;
        }

        /* Features */
        .features {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .feature-card {
            text-align: center;
            padding: 3rem 2rem;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
            border: 3px solid transparent;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(220, 10, 10, 0.2);
            border-color: var(--brand-red);
        }

        .feature-icon {
            color: var(--brand-red);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }

        .feature-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--brand-black);
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .feature-description {
            color: var(--text-light);
            line-height: 1.8;
            font-size: 1.05rem;
        }

        /* Testimonials */
        .testimonials-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .testimonial-card {
            background: white;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-left: 5px solid var(--brand-red);
            transition: all 0.3s;
        }

        .testimonial-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(220, 10, 10, 0.2);
        }

        .testimonial-rating {
            color: var(--brand-yellow);
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
        }

        .testimonial-text {
            color: var(--text);
            line-height: 1.8;
            margin-bottom: 2rem;
            font-style: italic;
            font-size: 1.05rem;
        }

        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .testimonial-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dc0a0a 0%, #8b0000 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .testimonial-info h4 {
            color: var(--brand-black);
            font-weight: 700;
            margin-bottom: 0.3rem;
            font-size: 1.1rem;
        }

        .testimonial-trip {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* Booking */
        .booking-section {
            background: linear-gradient(135deg, #0d0d0d 0%, #2d2d2d 100%);
            color: white;
            position: relative;
        }

        .booking-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(135deg, #dc0a0a 0%, #8b0000 100%);
        }

        .booking-form {
            max-width: 900px;
            margin: 3rem auto 0;
            background: rgba(220, 10, 10, 0.1);
            backdrop-filter: blur(10px);
            padding: 3.5rem;
            border: 3px solid var(--brand-red);
            box-shadow: 0 20px 60px rgba(220, 10, 10, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .form-group label {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select {
            padding: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.05rem;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--brand-red);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(220, 10, 10, 0.3);
        }

        .form-group select option {
            background: var(--brand-black);
            color: white;
        }

        .submit-btn {
            width: 100%;
            padding: 1.5rem;
            background: var(--brand-red);
            color: white;
            border: none;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
            font-family: 'Rajdhani', sans-serif;
        }

        .submit-btn:hover {
            background: #ff0000;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(220, 10, 10, 0.5);
        }

        /* Footer */
        .footer {
            background: var(--brand-black);
            color: white;
            padding: 4rem 2rem 2rem;
            border-top: 5px solid var(--brand-red);
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 3rem;
            margin-bottom: 3rem;
        }

        .footer-section h3 {
            font-family: 'Teko', sans-serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            color: var(--brand-red);
        }

        .footer-section p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 1rem;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .footer-links a:hover {
            color: var(--brand-red);
        }

        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .social-link {
            width: 50px;
            height: 50px;
            background: rgba(220, 10, 10, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid var(--brand-red);
        }

        .social-link:hover {
            background: var(--brand-red);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(220, 10, 10, 0.4);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 2rem;
            border-top: 2px solid rgba(220, 10, 10, 0.3);
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.05rem;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 1.5rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.05rem;
        }

        .hidden {
            display: none !important;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }

            .hero h1 {
                font-size: 3.5rem;
            }

            .section-title {
                font-size: 2.5rem;
            }

            .fleet-grid,
            .video-grid {
                grid-template-columns: 1fr;
            }

            .booking-form {
                padding: 2rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .state-filter {
                flex-direction: column;
                align-items: stretch;
            }

            .state-tab {
                width: 100%;
            }

            .destinations-mini-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }

        /* Mobile Menu */
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 350px;
            height: 100vh;
            background: var(--brand-black);
            box-shadow: -5px 0 30px rgba(220, 10, 10, 0.3);
            transition: right 0.3s ease;
            z-index: 1001;
            padding: 2rem;
            border-left: 5px solid var(--brand-red);
        }

        .mobile-menu.active {
            right: 0;
        }

        .mobile-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .mobile-menu-links {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
